[package]
name = "enrichr"
version = "0.1.1"
edition = "2021"
authors = ["Franz Geffke <mail@gofranz.com>"]
description = "Database-independent, privacy-friendly analytics event enrichment (visitor id, GeoIP, device, traffic source)"
documentation = "https://docs.rs/enrichr"
homepage = "https://github.com/franzos/enrichr"
repository = "https://github.com/franzos/enrichr"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["analytics", "geoip", "privacy", "user-agent", "referrer"]
categories = ["web-programming", "parser-implementations"]
exclude = ["/.github"]

[features]
default = ["serde", "blake3", "useragent", "referrer-list"]
serde = ["dep:serde", "chrono/serde"]
utoipa = ["dep:utoipa"]
typeshare = ["dep:typeshare"]
schemars = ["dep:schemars"]
sha256 = ["dep:sha2"]
blake3 = ["dep:blake3"]
geoip = ["dep:maxminddb"]
useragent = ["dep:ua-parser", "dep:yaml_serde"]
referrer-list = ["dep:psl", "dep:url"]
http-headers = []
full = ["serde", "utoipa", "typeshare", "schemars", "sha256", "blake3", "geoip", "useragent", "referrer-list", "http-headers"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arc-swap = "1.9"
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
utoipa = { version = "5", optional = true, features = ["chrono"] }
typeshare = { version = "1", optional = true }
schemars = { version = "1", optional = true, features = ["chrono04"] }
sha2 = { version = "0.10", optional = true }
blake3 = { version = "1.8", optional = true }
maxminddb = { version = "0.28", optional = true }
ua-parser = { version = "0.2", optional = true }
yaml_serde = { version = "0.10", optional = true }
psl = { version = "2.1", optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
serde_json = "1"
